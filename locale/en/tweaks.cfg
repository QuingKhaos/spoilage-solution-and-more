[item-name]
frozen-spoilage=Frozen spoilage

[recipe-name]
unfreeze-spoilage=Unfreeze spoilage

[mod-setting-name]
spoilage-solution-and-more-tweaks-frozen-spoilage=[color=cyan][font=heading-2]Tweaks[/font][/color] Enable frozen spoilage
spoilage-solution-and-more-tweaks-frozen-eggs=[color=cyan][font=heading-2]Tweaks[/font][/color] Frozen eggs spoil to enemy units
spoilage-solution-and-more-tweaks-hide-canned=[color=cyan][font=heading-2]Tweaks[/font][/color] Hide canned items/recipes
spoilage-solution-and-more-tweaks-hide-frozen=[color=cyan][font=heading-2]Tweaks[/font][/color] Hide frozen items/recipes

[mod-setting-description]
spoilage-solution-and-more-tweaks-frozen-spoilage=Makes frozen eggs spoil into frozen spoilage instead of normal spoilage.
spoilage-solution-and-more-tweaks-frozen-eggs=Makes frozen eggs spoil into enemy units instead of (frozen) spoilage.
spoilage-solution-and-more-tweaks-hide-canned=Makes canned items and their recipes hidden from factoriopedia and player crafting, like the vanilla barreling items and recipes are hidden too.
spoilage-solution-and-more-tweaks-hide-frozen=Makes frozen items and their recipes hidden from factoriopedia and player crafting, same principle as vanilla barreling items and recipes are hidden too.
